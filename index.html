<!DOCTYPE html>
<html>
<head>
    <title>Assignment Submission Portal Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 500px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input { display: block; width: 90%; margin-bottom: 10px; padding: 8px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Submit Assignment (Static Demo)</h2>
        <p>This is a static frontend demo for GitHub Pages.</p>
        <input type="text" placeholder="Name" required>
        <input type="text" placeholder="Registration Number" required>
        <input type="text" placeholder="Assignment Title" required>
        <input type="url" placeholder="Submission URL" required>
        <button type="button" onclick="alert('Demo: Submission function disabled on static page.')">Submit</button>
    </div>
</body>
</html>
