name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        # We output the results to JSON so the sender script can read it
        # The 'continue-on-error' ensures the pipeline proceeds to send the report even if a test fails
        run: npx jest --json --outputFile=results.json
        continue-on-error: true
        id: test_step

      - name: Send Report to Local Receiver
        env:
          RECEIVER_URL: "https://late-hotels-ask.loca.lt" # Make sure no trailing slash!
        run: node send-report.js

      # This ensures the pipeline actually fails in GitHub if the tests failed, as required
      - name: Enforce Test Status
        if: steps.test_step.outcome == 'failure'
        run: |
          echo "Tests failed! Marking pipeline as failed."
          exit 1
