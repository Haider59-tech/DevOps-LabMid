name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npx jest --json --outputFile=results.json
        continue-on-error: true
        id: test_step

      - name: Send Report to Local Receiver
        if: always()
        env:
          RECEIVER_URL: "https://twenty-comics-arrive.loca.lt"
        run: node send-report.js

      - name: Enforce Test Status
        if: steps.test_step.outcome == 'failure'
        run: |
          echo "Tests failed! Marking pipeline as failed."
          exit 1
